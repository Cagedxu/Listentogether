plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'Listentogether'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// 瀵搫鍩?javac 娴ｈ法鏁?UTF-8 鐠囪褰囧┃鎰瀮娴?
// Windows 姒涙顓?GBK閿涘矁瀚㈠┃鎰垳閸氼偂鑵戦弬?閻楄鐣╃粭锕€褰挎导姘辩椽鐠囨垶婀￠幑鐔锋綎鐎佃壈鍤ч懕濠傘亯娑旇京鐖?
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
}

// 闂婃娊顣剁憴锝囩垳鎼存捇鍘ょ純?- 閺嬪嫬缂撻弮璺烘値楠炴儼绻樻稉?jar閿涘牐鈧矂娼?JarJar 瀹撳苯顨滈敍?
// 閸樼喎娲? mp3spi 娑?vorbisspi 閸忓彉闊?javazoom.spi 閸栧拑绱濇担婊€璐熸稉銈勯嚋閻欘剛鐝?JiJ 濡€虫健
// 閸旂姾娴囬弮鏈电窗鐟欙箑褰?JPMS split package 閸愯尙鐛?(ResolutionException)閿?
// 閸氬牆鑻熸潻娑楀瘜 jar 閸氬孩澧嶉張澶岃鐏炵偘绨崥灞肩濡€虫健閿涘苯鍟跨粣浣圭Х闂勩們鈧?
configurations {
    audioLibs
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // 闂婃娊顣剁憴锝囩垳鎼?- 閺€顖涘瘮 MP3, OGG Vorbis, WAV, AIFF, AU 缁涘鐗稿?
    // 娴肩娀鈧帊绶风挧?jlayer (MP3鐟欙絿鐖? 閸?jorbis (Vorbis鐟欙絿鐖? 娴兼矮绔撮獮璺虹穿閸?
    audioLibs("com.googlecode.soundlibs:tritonus-share:0.3.7.4") {
        exclude group: 'junit', module: 'junit'
    }
    audioLibs("com.googlecode.soundlibs:mp3spi:1.9.5.4") {
        exclude group: 'junit', module: 'junit'
    }
    audioLibs("com.googlecode.soundlibs:vorbisspi:1.0.3.3") {
        exclude group: 'junit', module: 'junit'
    }
    // FLAC 閺冪姵宕棅鎶筋暥鐟欙絿鐖?- 閸?Java Sound SPI (FlacAudioFileReader/FlacFormatConversionProvider)
    audioLibs("org.jflac:jflac-codec:1.5.2") {
        exclude group: 'junit', module: 'junit'
    }
    // AAC/M4A 鐟欙絿鐖?- JAAD 缁?Java AAC 鐟欙絿鐖滈崳?+ MP4 鐟欙絽顦查悽銊ユ珤
    // 娴犲懏褰佹笟?AudioFileReader SPI (AACAudioFileReader)閿涘瞼娲块幒銉ㄧ箲閸?PCM 鐟欙絿鐖滃ù渚婄礉閺冪娀娓?FormatConversionProvider
    audioLibs("com.tianscar.javasound:jaad:0.9.4")
    audioLibs("net.jthink:jaudiotagger:3.0.1")

    // 缂傛牞鐦ч弮鏈电瘍闂団偓鐟曚線鐓舵０鎴濈氨缁紮绱欓懛顏勭暰娑?AACFileReader 閻╁瓨甯村鏇犳暏 jaad 閺嶇绺剧猾浼欑礆
    implementation("com.googlecode.soundlibs:tritonus-share:0.3.7.4") { exclude group: 'junit', module: 'junit' }
    implementation("com.googlecode.soundlibs:mp3spi:1.9.5.4") { exclude group: 'junit', module: 'junit' }
    implementation("com.googlecode.soundlibs:vorbisspi:1.0.3.3") { exclude group: 'junit', module: 'junit' }
    implementation("org.jflac:jflac-codec:1.5.2") { exclude group: 'junit', module: 'junit' }
    implementation("com.tianscar.javasound:jaad:0.9.4")
    implementation("net.jthink:jaudiotagger:3.0.1")
}

// 閻㈢喐鍨氶崥鍫濊嫙閸氬海娈?Java Sound SPI 閺堝秴濮熷▔銊ュ斀閺傚洣娆?
// mp3spi 閸?vorbisspi 閸氬嫭婀侀懛顏勭箒閻?META-INF/services 閺傚洣娆㈤敍鍫濇倱閸氬稄绱氶敍?
// 閻╁瓨甯寸憴锝呭瘶娴兼矮绨伴惄姝岊洬閻╂牭绱濊箛鍛淬€忛幍瀣З閸氬牆鑻熼崘鍛啇
def mergedServicesDir = layout.buildDirectory.dir('merged-services')

tasks.register('generateMergedServices') {
    outputs.dir(mergedServicesDir)
    doLast {
        def svcDir = new File(mergedServicesDir.get().asFile, 'META-INF/services')
        svcDir.mkdirs()
        new File(svcDir, 'javax.sound.sampled.spi.AudioFileReader').text = '''\
            com.musicmod.audio.AACFileReader
            javazoom.spi.mpeg.sampled.file.MpegAudioFileReader
            javazoom.spi.vorbis.sampled.file.VorbisAudioFileReader
            org.jflac.sound.spi.FlacAudioFileReader
            '''.stripIndent()
        new File(svcDir, 'javax.sound.sampled.spi.FormatConversionProvider').text = '''\
            javazoom.spi.mpeg.sampled.convert.MpegFormatConversionProvider
            javazoom.spi.vorbis.sampled.convert.VorbisFormatConversionProvider
            org.jflac.sound.spi.FlacFormatConversionProvider
            '''.stripIndent()
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    dependsOn generateMergedServices
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // 鐏忓棝鐓舵０鎴Ｐ掗惍浣哥氨閻ㄥ嫮琚弬鍥︽閸氬牆鑻熸潻娑楀瘜 jar
    // 閹烘帡娅? 閸氬嫬绨遍惃?services 閺傚洣娆?閻?generateMergedServices 閸氬牆鑻熼幓鎰返)閵?
    //       缁涙儳鎮曢弬鍥︽閵嗕府ANIFEST閵嗕沟odule-info(闁灝鍘ゆ稉搴濆瘜 jar 閸愯尙鐛?
    from(configurations.audioLibs.collect { zipTree(it) }) {
        exclude 'META-INF/services/**'
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
        exclude 'META-INF/MANIFEST.MF'
        exclude 'module-info.class'
        // 閹烘帡娅?jaad 閻?AACAudioFileReader SPI閿涘矂妲诲銏犵暊鐠囶垰鍨?MP3 娑撴柧绗夐弨顖涘瘮 fMP4
        exclude 'net/sourceforge/jaad/spi/javasound/AACAudioFileReader.class'
        exclude 'net/sourceforge/jaad/spi/javasound/AACAudioFileFormatType.class'
        exclude 'net/sourceforge/jaad/spi/javasound/AACAudioInputStream.class'
        exclude 'net/sourceforge/jaad/spi/javasound/AsynchronousAudioInputStream.class'
        exclude 'net/sourceforge/jaad/spi/javasound/CircularBuffer*.class'
        exclude 'net/sourceforge/jaad/spi/javasound/MP4AudioInputStream.class'
    }
    // 閸氬牆鑻熼崥搴ｆ畱 SPI 閺堝秴濮熷▔銊ュ斀閺傚洣娆?
    from(mergedServicesDir)

    // 鐠佺褰茬拠浣风瑢缁楊兛绗侀弬鐟帮紣閺勫函绱橫odrinth / LGPL 閸氬牐顫夐敍?
    from('LICENSE')
    from('THIRD_PARTY_NOTICES.md')
    from('LICENSES') {
        into 'META-INF/licenses'
    }

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

